<ui:composition template="/WEB-INF/template.xhtml"
                xmlns="http://w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="titulo">Inicio - Sistema Electoral</ui:define>

    <ui:define name="cuerpo">
        <p:panel header="Bienvenido al Sistema de Control Electoral">
            <p>Has iniciado sesión como: <strong>#{loginBean.usuarioLogueado.nombre} #{loginBean.usuarioLogueado.apellido}</strong>.</p>
            <p>Rol asignado: <strong>#{loginBean.usuarioLogueado.rol.nombreRol}</strong>.</p>
            <p>Utiliza el menú superior para acceder a los módulos habilitados según tus permisos.</p>
        </p:panel>
    </ui:define>
</ui:composition>
