<ui:composition template="/WEB-INF/template.xhtml"
                xmlns="http://w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="titulo">Ingreso de Actas - Juntas</ui:define>

    <ui:define name="cuerpo">
        <h:form id="formActaJunta">
            <p:growl id="mensajes" showDetail="true"/>

            <p:panel header="#{actaJuntaBean.modoEdicion ? 'Editando Acta de Juntas Parroquiales' : 'Registro de Acta de Juntas Parroquiales'}" style="margin-bottom: 20px;">
                <div style="display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 20px;">
                    <div style="flex: 1; min-width: 240px;">
                        <p:outputLabel for="parroquia" value="Parroquia:" style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                        <p:selectOneMenu id="parroquia" value="#{actaJuntaBean.idParroquia}" required="true"
                                         disabled="#{actaJuntaBean.modoEdicion}" style="width: 100%;">
                            <f:selectItem itemLabel="Seleccione parroquia" itemValue=""/>
                            <f:selectItems value="#{actaJuntaBean.parroquias}" var="p"
                                           itemLabel="#{p.nombre}" itemValue="#{p.idParroquia}"/>
                            <p:ajax listener="#{actaJuntaBean.alSeleccionarParroquia}" update="recinto tablaVotos"/>
                        </p:selectOneMenu>
                    </div>

                    <div style="flex: 1; min-width: 240px;">
                        <p:outputLabel for="recinto" value="Recinto:" style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                        <p:selectOneMenu id="recinto" value="#{actaJuntaBean.idRecinto}" required="true"
                                         disabled="#{actaJuntaBean.modoEdicion}" style="width: 100%;">
                            <f:selectItem itemLabel="Seleccione recinto" itemValue=""/>
                            <f:selectItems value="#{actaJuntaBean.recintos}" var="r"
                                           itemLabel="#{r.nombre}" itemValue="#{r.idRecinto}"/>
                        </p:selectOneMenu>
                    </div>

                    <div style="flex: 0.6; min-width: 160px;">
                        <p:outputLabel for="mesa" value="Número de Mesa:" style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                        <p:inputNumber id="mesa" value="#{actaJuntaBean.NMesa}" decimalPlaces="0" minValue="1"
                                       required="true" disabled="#{actaJuntaBean.modoEdicion}" inputStyle="width: 100%;"/>
                    </div>
                </div>


                <p:dataTable id="tablaVotos" value="#{actaJuntaBean.listaVotos}" var="v"
                             emptyMessage="Seleccione una parroquia rural para cargar los candidatos de Junta Parroquial.">
                    <p:column headerText="Lista" style="width: 250px;">
                        <h:outputText value="#{v.junta.lista.nombre}"/>
                    </p:column>
                    <p:column headerText="Candidato Junta Parroquial">
                        <h:outputText value="#{v.junta.nombre}"/>
                    </p:column>
                    <p:column headerText="Votos Obtenidos" style="width: 180px;">
                        <p:inputNumber value="#{v.NVoto}" decimalPlaces="0" minValue="0" required="true"/>
                    </p:column>
                </p:dataTable>

                <div style="margin-top: 20px; text-align: right;">
                    <p:commandButton value="Cancelar Edición" action="#{actaJuntaBean.cancelarEdicion}"
                                     rendered="#{actaJuntaBean.modoEdicion}" update="formActaJunta" process="@this"
                                     icon="pi pi-times" styleClass="ui-button-secondary" style="margin-right: 10px;"/>
                    <p:commandButton value="#{actaJuntaBean.modoEdicion ? 'Actualizar Acta' : 'Guardar Acta de Juntas'}"
                                     action="#{actaJuntaBean.guardarActa}" update="formActaJunta" icon="pi pi-check"/>
                </div>
            </p:panel>

            <p:panel header="#{loginBean.administrador ? 'Todas las Actas de Juntas Registradas' : 'Mis Actas de Juntas Registradas'}">
                <p:dataTable value="#{actaJuntaBean.actasRegistradas}" var="acta" paginator="true" rows="10"
                             emptyMessage="No hay actas registradas.">
                    <p:column headerText="Parroquia">
                        <h:outputText value="#{acta[1]}"/>
                    </p:column>
                    <p:column headerText="Recinto">
                        <h:outputText value="#{acta[2]}"/>
                    </p:column>
                    <p:column headerText="Mesa" style="width: 90px; text-align: center;">
                        <h:outputText value="#{acta[3]}"/>
                    </p:column>
                    <p:column headerText="Digitador" rendered="#{loginBean.administrador}">
                        <h:outputText value="#{acta[4]}"/>
                    </p:column>
                    <p:column headerText="Total Votos" style="width: 120px; text-align: right;">
                        <h:outputText value="#{acta[5]}"/>
                    </p:column>
                    <p:column headerText="Acción" style="width: 110px; text-align: center;">
                        <p:commandButton icon="pi pi-pencil" value="Editar"
                                         action="#{actaJuntaBean.editarActa(acta[0], acta[3])}"
                                         update="formActaJunta" process="@this"/>
                    </p:column>
                </p:dataTable>
            </p:panel>

        </h:form>
    </ui:define>
</ui:composition>
