<ui:composition template="/WEB-INF/template.xhtml"
                xmlns="http://w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="titulo">Ingreso de Actas - Alcaldes</ui:define>

    <ui:define name="cuerpo">
        <h:form id="formActaAlcalde">
            <p:growl id="mensajes" showDetail="true"/>

            <p:panel header="#{actaAlcaldeBean.modoEdicion ? 'Editando Acta de Alcaldes' : 'Registro de Acta de Alcaldes'}" style="margin-bottom: 20px;">
                <div style="display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 20px;">
                    <div style="flex: 1; min-width: 240px;">
                        <p:outputLabel for="parroquia" value="Parroquia:" style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                        <p:selectOneMenu id="parroquia" value="#{actaAlcaldeBean.idParroquia}" required="true"
                                         disabled="#{actaAlcaldeBean.modoEdicion}" style="width: 100%;">
                            <f:selectItem itemLabel="Seleccione parroquia" itemValue=""/>
                            <f:selectItems value="#{actaAlcaldeBean.parroquias}" var="p"
                                           itemLabel="#{p.nombre}" itemValue="#{p.idParroquia}"/>
                            <p:ajax listener="#{actaAlcaldeBean.cargarRecintos}" update="recinto"/>
                        </p:selectOneMenu>
                    </div>

                    <div style="flex: 1; min-width: 240px;">
                        <p:outputLabel for="recinto" value="Recinto:" style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                        <p:selectOneMenu id="recinto" value="#{actaAlcaldeBean.idRecinto}" required="true"
                                         disabled="#{actaAlcaldeBean.modoEdicion}" style="width: 100%;">
                            <f:selectItem itemLabel="Seleccione recinto" itemValue=""/>
                            <f:selectItems value="#{actaAlcaldeBean.recintos}" var="r"
                                           itemLabel="#{r.nombre}" itemValue="#{r.idRecinto}"/>
                        </p:selectOneMenu>
                    </div>

                    <div style="flex: 0.6; min-width: 160px;">
                        <p:outputLabel for="mesa" value="Número de Mesa:" style="display: block; margin-bottom: 5px; font-weight: bold;"/>
                        <p:inputNumber id="mesa" value="#{actaAlcaldeBean.NMesa}" decimalPlaces="0" minValue="1"
                                       required="true" disabled="#{actaAlcaldeBean.modoEdicion}" inputStyle="width: 100%;"/>
                    </div>
                </div>


                <p:dataTable value="#{actaAlcaldeBean.listaVotos}" var="v">
                    <p:column headerText="Lista" style="width: 250px;">
                        <h:outputText value="#{v.alcalde.lista.nombre}"/>
                    </p:column>
                    <p:column headerText="Candidato a Alcalde">
                        <h:outputText value="#{v.alcalde.nombre}"/>
                    </p:column>
                    <p:column headerText="Votos Obtenidos" style="width: 180px;">
                        <p:inputNumber value="#{v.NVoto}" decimalPlaces="0" minValue="0" required="true"/>
                    </p:column>
                </p:dataTable>

                <div style="margin-top: 20px; text-align: right;">
                    <p:commandButton value="Cancelar Edición" action="#{actaAlcaldeBean.cancelarEdicion}"
                                     rendered="#{actaAlcaldeBean.modoEdicion}" update="formActaAlcalde" process="@this"
                                     icon="pi pi-times" styleClass="ui-button-secondary" style="margin-right: 10px;"/>
                    <p:commandButton value="#{actaAlcaldeBean.modoEdicion ? 'Actualizar Acta' : 'Guardar Acta de Alcaldes'}"
                                     action="#{actaAlcaldeBean.guardarActa}" update="formActaAlcalde" icon="pi pi-check"/>
                </div>
            </p:panel>

            <p:panel header="#{loginBean.administrador ? 'Todas las Actas de Alcaldes Registradas' : 'Mis Actas de Alcaldes Registradas'}">
                <p:dataTable value="#{actaAlcaldeBean.actasRegistradas}" var="acta" paginator="true" rows="10"
                             emptyMessage="No hay actas registradas.">
                    <p:column headerText="Parroquia">
                        <h:outputText value="#{acta[1]}"/> <!-- Nombre Parroquia -->
                    </p:column>
                    <p:column headerText="Recinto">
                        <h:outputText value="#{acta[2]}"/> <!-- Nombre Recinto -->
                    </p:column>
                    <p:column headerText="Mesa" style="width: 90px; text-align: center;">
                        <h:outputText value="#{acta[3]}"/> <!-- Número Mesa -->
                    </p:column>
                    <p:column headerText="Digitador" rendered="#{loginBean.administrador}">
                        <h:outputText value="#{acta[4]}"/> <!-- Nombre Digitador -->
                    </p:column>
                    <p:column headerText="Total Votos" style="width: 120px; text-align: right;">
                        <h:outputText value="#{acta[5]}"/> <!-- Suma Total de Votos -->
                    </p:column>
                    <p:column headerText="Acción" style="width: 110px; text-align: center;">
                        <p:commandButton icon="pi pi-pencil" value="Editar"
                                         action="#{actaAlcaldeBean.cargarParaEditar(acta[0], acta[3])}"
                                         update="formActaAlcalde" process="@this"/>
                    </p:column>
                </p:dataTable>
            </p:panel>

        </h:form>
    </ui:define>
</ui:composition>
