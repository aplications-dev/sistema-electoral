<ui:composition template="/WEB-INF/template.xhtml"
                xmlns="http://w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="titulo">Reporte de Votos - Alcaldes</ui:define>

    <ui:define name="cuerpo">
        <p:panel header="Resultados Consolidados de Votos - Alcaldes">
            <p:dataTable value="#{reportesBean.resultadosAlcalde}" var="fila">
                <p:column headerText="Lista / Movimiento">
                    <h:outputText value="#{fila[0]}"/>
                </p:column>
                <p:column headerText="Candidato a Alcalde">
                    <h:outputText value="#{fila[1]}"/>
                </p:column>
                <p:column headerText="Total de Votos" style="width: 180px; text-align: right;">
                    <h:outputText value="#{fila[2]}" style="font-weight: bold;"/>
                </p:column>
            </p:dataTable>
        </p:panel>
    </ui:define>
</ui:composition>
