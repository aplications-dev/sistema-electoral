<ui:composition template="/WEB-INF/template.xhtml"
                xmlns="http://w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="titulo">Reporte de Votos - Concejales</ui:define>

    <ui:define name="cuerpo">
        <h:form id="formReporteConcejal">
            <p:panel header="Resultados Consolidados de Votos - Concejales">
                <div style="margin-bottom: 15px; display: flex; align-items: center; gap: 10px;">
                    <p:outputLabel for="filtroTipo" value="Filtrar por circunscripción:" style="font-weight: bold;"/>
                    <p:selectOneMenu id="filtroTipo" value="#{reportesBean.tipoConcejalFiltro}">
                        <f:selectItem itemLabel="Todos (Urbanos y Rurales)" itemValue=""/>
                        <f:selectItem itemLabel="Concejales Urbanos" itemValue="URBANA"/>
                        <f:selectItem itemLabel="Concejales Rurales" itemValue="RURAL"/>
                        <p:ajax update="tablaConcejales"/>
                    </p:selectOneMenu>
                </div>

                <p:dataTable id="tablaConcejales" value="#{reportesBean.resultadosConcejal}" var="fila"
                             emptyMessage="No existen votos registrados para el filtro seleccionado.">
                    <p:column headerText="Lista / Movimiento">
                        <h:outputText value="#{fila[0]}"/>
                    </p:column>
                    <p:column headerText="Tipo" style="width: 150px;">
                        <h:outputText value="#{fila[1]}"/>
                    </p:column>
                    <p:column headerText="Candidato a Concejal">
                        <h:outputText value="#{fila[2]}"/>
                    </p:column>
                    <p:column headerText="Total de Votos" style="width: 180px; text-align: right;">
                        <h:outputText value="#{fila[3]}" style="font-weight: bold;"/>
                    </p:column>
                </p:dataTable>
            </p:panel>
        </h:form>
    </ui:define>
</ui:composition>
