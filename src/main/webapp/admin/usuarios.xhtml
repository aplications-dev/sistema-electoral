<ui:composition template="/WEB-INF/template.xhtml"
                xmlns="http://w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="titulo">Gestión de Usuarios</ui:define>

    <ui:define name="cuerpo">
        <h:form id="formUsuarios">
            <p:growl id="mensajes" showDetail="true"/>

            <p:panel header="Formulario de Usuario" style="margin-bottom: 20px;">
                <p:panelGrid columns="4" layout="grid" styleClass="ui-panelgrid-blank">
                    <p:outputLabel for="nombre" value="Nombre:"/>
                    <p:inputText id="nombre" value="#{usuarioBean.usuarioSeleccionado.nombre}" required="true"/>

                    <p:outputLabel for="apellido" value="Apellido:"/>
                    <p:inputText id="apellido" value="#{usuarioBean.usuarioSeleccionado.apellido}" required="true"/>

                    <p:outputLabel for="cedula" value="Cédula:"/>
                    <p:inputText id="cedula" value="#{usuarioBean.usuarioSeleccionado.cedula}" required="true"/>

                    <p:outputLabel for="password" value="Contraseña:"/>
                    <p:password id="password" value="#{usuarioBean.usuarioSeleccionado.password}"
                                redisplay="true" required="true"/>

                    <p:outputLabel for="rol" value="Rol:"/>
                    <p:selectOneMenu id="rol" value="#{usuarioBean.idRolSeleccionado}" required="true">
                        <f:selectItem itemLabel="Seleccione un rol" itemValue=""/>
                        <f:selectItems value="#{usuarioBean.listaRoles}" var="r"
                                       itemLabel="#{r.nombreRol}" itemValue="#{r.idRol}"/>
                    </p:selectOneMenu>
                </p:panelGrid>

                <div style="margin-top: 15px;">
                    <p:commandButton value="Guardar" action="#{usuarioBean.guardar}"
                                     update="formUsuarios" icon="pi pi-save" style="margin-right: 10px;"/>
                    <p:commandButton value="Nuevo / Limpiar" action="#{usuarioBean.nuevo}"
                                     update="formUsuarios" process="@this" icon="pi pi-refresh"
                                     styleClass="ui-button-secondary"/>
                </div>
            </p:panel>

            <p:panel header="Usuarios Registrados">
                <p:dataTable value="#{usuarioBean.listaUsuarios}" var="u" paginator="true" rows="10">
                    <p:column headerText="ID" style="width: 60px;">
                        <h:outputText value="#{u.idUsuario}"/>
                    </p:column>
                    <p:column headerText="Cédula">
                        <h:outputText value="#{u.cedula}"/>
                    </p:column>
                    <p:column headerText="Nombre">
                        <h:outputText value="#{u.nombre} #{u.apellido}"/>
                    </p:column>
                    <p:column headerText="Rol">
                        <h:outputText value="#{u.rol.nombreRol}"/>
                    </p:column>
                    <p:column headerText="Acciones" style="width: 140px; text-align: center;">
                        <p:commandButton icon="pi pi-pencil" action="#{usuarioBean.editar(u)}"
                                         update="formUsuarios" process="@this" title="Editar"
                                         style="margin-right: 5px;"/>
                        <p:commandButton icon="pi pi-trash" action="#{usuarioBean.eliminar(u.idUsuario)}"
                                         update="formUsuarios" process="@this" title="Eliminar"
                                         styleClass="ui-button-danger">
                            <p:confirm header="Confirmación" message="¿Eliminar este usuario?" icon="pi pi-exclamation-triangle"/>
                        </p:commandButton>
                    </p:column>
                </p:dataTable>
            </p:panel>

            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                <p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check"/>
                <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-secondary" icon="pi pi-times"/>
            </p:confirmDialog>
        </h:form>
    </ui:define>
</ui:composition>
